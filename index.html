<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta name="theme-color" content="#e9437a">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glicemia da Sarah</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
:root{
  --bg:#fff7fa; --surface:#ffffff; --fg:#3a2e4f; --muted:#83789a; --line:#f1e3ea;
  --accent:#e9437a; --accent-ink:#ffffff; --accent-soft:#ffe3ee;
  --ok:#1f9d55; --ok-soft:#ddf6e7; --warn:#d9480f; --warn-soft:#ffe8dc; --low:#6741d9; --low-soft:#ece6ff;
  --display:"Fredoka","Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#1c1622; --surface:#271f2f; --fg:#f5eef8; --muted:#b2a6c2; --line:#3a2f45;
  --accent:#ff6f9f; --accent-ink:#2a0d18; --accent-soft:#4a2234;
  --ok:#5fd897; --ok-soft:#173a29; --warn:#ff9b6a; --warn-soft:#45261a; --low:#b39bff; --low-soft:#2f2650; color-scheme:dark}}
*{box-sizing:border-box}[hidden]{display:none!important}img{max-width:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 48px;display:flex;flex-direction:column;gap:20px}
h1,h2{font-family:var(--display);margin:0;line-height:1.15}
h1{font-size:1.75rem}
h2{font-size:1.2rem}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.date{color:var(--muted);font-weight:700;font-size:.9rem;text-transform:capitalize}
.label{font-size:.75rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.slots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.slot{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:2px;text-align:left;font:inherit;color:inherit;cursor:pointer}
.slot .v{font-family:var(--display);font-size:2rem;font-weight:600;line-height:1.1}
.slot .meta{font-size:.8rem;color:var(--muted);font-weight:700}
.slot.empty .v{color:var(--muted);font-size:1.1rem;padding:8px 0 6px}
.slot.ok{border-color:var(--ok);background:var(--ok-soft)}
.slot.high{border-color:var(--warn);background:var(--warn-soft)}
.slot.low{border-color:var(--low);background:var(--low-soft)}
.pill{display:inline-block;font-size:.72rem;font-weight:800;padding:2px 8px;border-radius:999px}
.pill.ok{background:var(--ok);color:var(--surface)}
.pill.high{background:var(--warn);color:var(--surface)}
.pill.low{background:var(--low);color:var(--surface)}
.btn{font:inherit;font-weight:800;border:0;border-radius:14px;padding:14px 18px;cursor:pointer;background:var(--accent);color:var(--accent-ink);font-size:1rem}
.btn.ghost{background:var(--accent-soft);color:var(--fg)}
.btn.small{padding:8px 12px;font-size:.85rem;border-radius:10px}
.btn[disabled]{opacity:.55}
.card{background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-weight:800;font-size:.9rem}
input,textarea{font:inherit;color:var(--fg);background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:12px;width:100%}
textarea{min-height:70px}
.big{font-family:var(--display);font-size:2rem;font-weight:600;text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-weight:700;font-size:.85rem;border:2px solid var(--line);background:var(--bg);color:var(--fg);border-radius:999px;padding:7px 12px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.photo{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.photo img{width:84px;height:84px;object-fit:cover;border-radius:14px;border:2px solid var(--line)}
.verdict{border-radius:14px;padding:10px 12px;font-weight:700;font-size:.92rem}
.verdict.ok{background:var(--ok-soft);color:var(--ok)}
.verdict.high{background:var(--warn-soft);color:var(--warn)}
.verdict.low{background:var(--low-soft);color:var(--low)}
.day{display:flex;flex-direction:column;gap:8px}
.day h3{font-family:var(--display);font-size:1rem;margin:4px 0 0;text-transform:capitalize}
.entry{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:start;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:10px 12px}
.entry .num{font-family:var(--display);font-size:1.6rem;font-weight:600;min-width:58px;text-align:center;border-radius:12px;padding:4px 6px}
.entry .num.ok{background:var(--ok-soft);color:var(--ok)}
.entry .num.high{background:var(--warn-soft);color:var(--warn)}
.entry .num.low{background:var(--low-soft);color:var(--low)}
.entry .t{font-weight:800}
.entry .food{font-size:.9rem;color:var(--muted);overflow-wrap:anywhere}
.entry img{width:52px;height:52px;object-fit:cover;border-radius:10px;cursor:pointer}
.entry .side{display:flex;flex-direction:column;align-items:end;gap:6px}
.linkbtn{font:inherit;font-size:.8rem;font-weight:700;color:var(--muted);background:none;border:0;cursor:pointer;padding:2px}
.confirm{grid-column:1/-1;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-weight:700;font-size:.9rem}
.empty-state{text-align:center;padding:20px 12px;color:var(--muted)}
.empty-state strong{display:block;color:var(--fg);font-family:var(--display);font-size:1.1rem;margin-bottom:4px}
.goals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;text-align:center}
.goals div{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:8px 4px}
.goals b{display:block;font-family:var(--display);font-size:1.3rem}
.goals span{font-size:.75rem;font-weight:700;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:800;z-index:20;max-width:90vw}
.viewer{position:fixed;inset:0;background:rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center;z-index:30;padding:24px}
.viewer img{max-height:90vh;border-radius:16px}
.status{font-size:.85rem;color:var(--muted);text-align:center}
</style>
</head>
<body>
<div class="wrap" id="pinScreen" style="min-height:80vh;justify-content:center">
  <div class="card" style="text-align:center">
    <h1>Glicemia da Sarah</h1>
    <div class="field"><label for="pin">Digite o PIN</label>
    <input id="pin" class="big" type="password" inputmode="numeric" autocomplete="off" placeholder="******"></div>
    <button class="btn" id="entrarBtn" type="button">Entrar</button>
    <div class="status" id="pinStatus"></div>
  </div>
</div>
<div class="wrap" id="app" hidden>
  <header class="top">
    <div>
      <h1>Glicemia da Sarah</h1>
      <div class="date" id="today"></div>
    </div>
    <div style="display:flex;gap:8px"><button class="btn small ghost" id="exportBtn" type="button">Exportar</button><button class="btn small ghost" id="sairBtn" type="button">Sair</button></div>
  </header>
  <section style="display:flex;flex-direction:column;gap:10px">
    <div class="label">Hoje · toque para registrar</div>
    <div class="slots" id="slots"></div>
  </section>
  <section class="card" id="formCard">
    <h2>Nova medição</h2>
    <div class="field">
      <label>Qual medição?</label>
      <div class="chips" id="tipoChips"></div>
    </div>
    <div class="field">
      <label for="foto">Foto do aparelho</label>
      <div class="photo">
        <img id="fotoPrev" alt="Foto da medição" hidden>
        <input type="file" id="foto" accept="image/*" capture="environment" style="flex:1 1 180px">
      </div>
    </div>
    <div class="field">
      <label for="valor">Valor (mg/dL)</label>
      <input id="valor" class="big" type="number" inputmode="numeric" min="20" max="600" placeholder="000">
    </div>
    <div id="verdict" class="verdict" hidden></div>
    <div class="field" id="comidaField">
      <label for="comida">O que ela comeu?</label>
      <textarea id="comida" placeholder="Ex.: 2 bisnaguinhas com requeijão e 3 fatias de queijo minas"></textarea>
    </div>
    <div class="field">
      <label for="quando">Data e hora</label>
      <input id="quando" type="datetime-local">
    </div>
    <div class="field">
      <label for="obs">Observação (opcional)</label>
      <input id="obs" placeholder="Ex.: estava com dor, dormiu mal">
    </div>
    <button class="btn" id="salvarBtn" type="button">Salvar medição</button>
    <div class="status" id="status"></div>
  </section>
  <section style="display:flex;flex-direction:column;gap:10px">
    <div class="label">Metas</div>
    <div class="goals">
      <div><b>até 95</b><span>Jejum</span></div>
      <div><b>até 140</b><span>1h após comer</span></div>
      <div><b>70+</b><span>Abaixo: comer algo</span></div>
    </div>
  </section>
  <section style="display:flex;flex-direction:column;gap:10px">
    <div class="label">Diário</div>
    <div id="hist"></div>
  </section>
</div>
<script>
const TIPOS=[{id:"jejum",nome:"Jejum",hora:"5h",meta:95,comida:false},{id:"cafe",nome:"Após café",hora:"6h15",meta:140,comida:true},{id:"almoco",nome:"Após almoço",hora:"12h",meta:140,comida:true},{id:"jantar",nome:"Após jantar",hora:"20h30",meta:140,comida:true},{id:"outra",nome:"Outra",hora:"",meta:140,comida:true}];
const tipoById=Object.fromEntries(TIPOS.map(t=>[t.id,t]));
const $=s=>document.querySelector(s);
let PIN="",entries=[],tipo="jejum",fotoFull=null,fotoMini=null,pendingDelete=null;
const SB_URL="https://zdzftedtyziogirmjrjk.supabase.co",SB_KEY="sb_publishable_NhPfs8moxdI8m4ivZ8TKrw_bfNva6d_";
async function rpc(fn,body){const r=await fetch(SB_URL+"/rest/v1/rpc/glicemia_"+fn,{method:"POST",headers:{"apikey":SB_KEY,"Content-Type":"application/json"},body:JSON.stringify(body)});const t=await r.text();let j=null;try{j=JSON.parse(t)}catch(e){}if(!r.ok){const e=new Error((j&&j.message)||"erro");e.code=(j&&j.message)||"erro";throw e}return j}
const call=(fn,pin,arg)=>{if(fn==="entrar")return rpc("entrar",{p_pin:pin});if(fn==="listar")return rpc("listar",{p_pin:pin});if(fn==="apagar")return rpc("apagar",{p_pin:pin,p_id:arg});if(fn==="foto")return rpc("foto",{p_pin:pin,p_id:arg});if(fn==="salvar")return rpc("salvar",{p_pin:pin,p_tipo:arg.tipo,p_valor:arg.valor,p_comida:arg.comida,p_obs:arg.obs,p_quando_ms:arg.quandoMs,p_foto:arg.foto,p_mini:arg.mini}).then(id=>({id}))};
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
function statusOf(v,t){if(v<70)return"low";return v<=((tipoById[t]&&tipoById[t].meta)||140)?"ok":"high"}
function verdictText(v,t){const s=statusOf(v,t),m=(tipoById[t]&&tipoById[t].meta)||140;if(s==="low")return"Glicose baixa. Coma algo agora (1 balinha) e meça de novo em 15 minutos.";if(s==="ok")return"Dentro da meta (até "+m+"). Muito bem!";return"Acima da meta (até "+m+"). Anote o que comeu. Se repetir na semana, avise o médico."}
function dayKey(ms){const d=new Date(ms);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function fmtDay(k){const p=k.split("-").map(Number);if(k===dayKey(Date.now()))return"Hoje";if(k===dayKey(Date.now()-864e5))return"Ontem";return new Date(p[0],p[1]-1,p[2]).toLocaleDateString("pt-BR",{weekday:"long",day:"2-digit",month:"2-digit"})}
function fmtTime(ms){return new Date(ms).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})}
function localInput(ms){const d=new Date(ms);d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,16)}
function toast(msg){const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}
function guessTipo(){const h=new Date().getHours()+new Date().getMinutes()/60;if(h<5.75)return"jejum";if(h<9)return"cafe";if(h<16)return"almoco";return"jantar"}
function nomeSit(s){return s==="ok"?"na meta":s==="high"?"acima":"baixa"}
$("#today").textContent=new Date().toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long"});
function renderChips(){const box=$("#tipoChips");box.innerHTML="";TIPOS.forEach(t=>{const b=document.createElement("button");b.type="button";b.className="chip";b.textContent=t.nome;b.setAttribute("aria-pressed",String(t.id===tipo));b.onclick=()=>setTipo(t.id);box.appendChild(b)});$("#comidaField").hidden=!tipoById[tipo].comida}
function setTipo(id){tipo=id;renderChips();updateVerdict()}
function renderSlots(){const box=$("#slots");box.innerHTML="";const hoje=dayKey(Date.now());TIPOS.slice(0,4).forEach(t=>{const e=entries.filter(x=>x.tipo===t.id&&dayKey(x.quandoMs)===hoje).sort((a,b)=>b.quandoMs-a.quandoMs)[0];const b=document.createElement("button");b.type="button";const s=e?statusOf(e.valor,t.id):"";b.className="slot "+(e?s:"empty");const l=document.createElement("div");l.className="label";l.textContent=t.nome+" · "+t.hora;const v=document.createElement("div");v.className="v";v.textContent=e?e.valor:"Registrar";const m=document.createElement("div");m.className="meta";m.textContent=e?("meta até "+t.meta+" · "+fmtTime(e.quandoMs)):("meta até "+t.meta);b.append(l,v,m);b.onclick=()=>{setTipo(t.id);$("#formCard").scrollIntoView({behavior:"smooth",block:"start"})};box.appendChild(b)})}
function renderHist(){const box=$("#hist");if(!entries.length){box.innerHTML='<div class="empty-state"><strong>Nenhuma medição ainda</strong>Toque em "Jejum" lá em cima para registrar a primeira.</div>';return}box.innerHTML="";const g={};entries.slice().sort((a,b)=>b.quandoMs-a.quandoMs).forEach(e=>{const k=dayKey(e.quandoMs);(g[k]=g[k]||[]).push(e)});Object.keys(g).sort().reverse().forEach(k=>{const sec=document.createElement("div");sec.className="day";const h=document.createElement("h3");h.textContent=fmtDay(k);sec.appendChild(h);g[k].forEach(e=>{const s=statusOf(e.valor,e.tipo);const row=document.createElement("div");row.className="entry";const n=document.createElement("div");n.className="num "+s;n.textContent=e.valor;const mid=document.createElement("div");const t=document.createElement("div");t.className="t";t.textContent=((tipoById[e.tipo]&&tipoById[e.tipo].nome)||"Medição")+" · "+fmtTime(e.quandoMs)+" ";const p=document.createElement("span");p.className="pill "+s;p.textContent=nomeSit(s);t.appendChild(p);mid.appendChild(t);if(e.comida){const f=document.createElement("div");f.className="food";f.textContent=e.comida;mid.appendChild(f)}if(e.obs){const o=document.createElement("div");o.className="food";o.textContent="Obs.: "+e.obs;mid.appendChild(o)}const side=document.createElement("div");side.className="side";if(e.mini&&String(e.mini).indexOf("data:image/")===0){const im=document.createElement("img");im.src=e.mini;im.alt="Foto do aparelho";im.onclick=async()=>{openViewer(im.src);if(e.temFoto){try{const f=await call("foto",PIN,e.id);if(f){const v=document.querySelector(".viewer img");if(v)v.src=f}}catch(x){}}};side.appendChild(im)}const del=document.createElement("button");del.className="linkbtn";del.textContent="Apagar";del.onclick=()=>{pendingDelete=e.id;renderHist()};side.appendChild(del);row.append(n,mid,side);if(pendingDelete===e.id){const c=document.createElement("div");c.className="confirm";c.append("Apagar esta medição?");const y=document.createElement("button");y.className="btn small";y.textContent="Apagar";y.onclick=async()=>{try{await call("apagar",PIN,e.id);entries=entries.filter(x=>x.id!==e.id);toast("Medição apagada")}catch(err){toast("Não foi possível apagar")}pendingDelete=null;renderSlots();renderHist()};const no=document.createElement("button");no.className="btn small ghost";no.textContent="Cancelar";no.onclick=()=>{pendingDelete=null;renderHist()};c.append(y,no);row.appendChild(c)}sec.appendChild(row)});box.appendChild(sec)})}
function openViewer(src){const v=document.createElement("div");v.className="viewer";const im=document.createElement("img");im.src=src;v.appendChild(im);v.onclick=()=>v.remove();document.body.appendChild(v)}
function updateVerdict(){const v=Number($("#valor").value),box=$("#verdict");if(!v){box.hidden=true;return}const s=statusOf(v,tipo);box.className="verdict "+s;box.textContent=verdictText(v,tipo);box.hidden=false}
$("#valor").addEventListener("input",updateVerdict);
async function toDataUrl(file,max,q){const url=URL.createObjectURL(file);const img=await new Promise((r,j)=>{const i=new Image();i.onload=()=>r(i);i.onerror=j;i.src=url});const sc=Math.min(1,max/Math.max(img.width,img.height));const cv=document.createElement("canvas");cv.width=Math.round(img.width*sc);cv.height=Math.round(img.height*sc);cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);URL.revokeObjectURL(url);return cv.toDataURL("image/jpeg",q)}
$("#foto").addEventListener("change",async ev=>{const f=ev.target.files&&ev.target.files[0];if(!f){fotoFull=fotoMini=null;$("#fotoPrev").hidden=true;return}try{fotoFull=await toDataUrl(f,900,.7);fotoMini=await toDataUrl(f,220,.6);const p=$("#fotoPrev");p.src=fotoMini;p.hidden=false}catch(e){toast("Não consegui abrir a foto")}});
$("#salvarBtn").onclick=async()=>{const v=Number($("#valor").value);if(!(v>=20&&v<=600)){$("#status").textContent="Digite o valor que apareceu no aparelho (entre 20 e 600).";$("#valor").focus();return}const btn=$("#salvarBtn");btn.disabled=true;btn.textContent="Salvando...";$("#status").textContent="";const ms=$("#quando").value?new Date($("#quando").value).getTime():Date.now();const m={tipo:tipo,valor:v,comida:tipoById[tipo].comida?$("#comida").value.trim():"",obs:$("#obs").value.trim(),quandoMs:ms,foto:fotoFull,mini:fotoMini};try{const r=await call("salvar",PIN,m);entries.unshift({id:r.id,tipo:tipo,valor:v,comida:m.comida,obs:m.obs,mini:fotoMini,temFoto:!!fotoFull,quandoMs:ms});renderSlots();renderHist();toast(statusOf(v,tipo)==="ok"?"Salvo! Dentro da meta.":"Salvo.");$("#valor").value="";$("#comida").value="";$("#obs").value="";$("#foto").value="";fotoFull=fotoMini=null;$("#fotoPrev").hidden=true;$("#quando").value=localInput(Date.now());updateVerdict();window.scrollTo({top:0,behavior:"smooth"})}catch(err){$("#status").textContent="Não foi possível salvar. Confira a internet e tente de novo."}btn.disabled=false;btn.textContent="Salvar medição"};
async function entrar(pin,silencioso){$("#pinStatus").textContent=silencioso?"":"Entrando...";try{await call("entrar",pin);PIN=pin;store.set("glic_pin",pin);$("#pinScreen").hidden=true;$("#app").hidden=false;carregar()}catch(e){store.del("glic_pin");$("#pinScreen").hidden=false;$("#pinStatus").textContent=silencioso?"":(e.code==="muitas_tentativas"?"Muitas tentativas erradas. Espere 10 minutos.":"PIN incorreto. Tente de novo.")}}
async function carregar(){try{entries=await call("listar",PIN)||[];renderSlots();renderHist()}catch(e){$("#status").textContent="Não foi possível carregar o diário."}}
$("#entrarBtn").onclick=()=>entrar($("#pin").value.trim());
$("#pin").addEventListener("keydown",e=>{if(e.key==="Enter")entrar($("#pin").value.trim())});
$("#sairBtn").onclick=()=>{store.del("glic_pin");PIN="";$("#app").hidden=true;$("#pinScreen").hidden=false;$("#pin").value=""};
$("#exportBtn").onclick=()=>{const rows=[["Data","Hora","Medição","Valor (mg/dL)","Situação","O que comeu","Observação"]];entries.slice().sort((a,b)=>a.quandoMs-b.quandoMs).forEach(e=>{rows.push([new Date(e.quandoMs).toLocaleDateString("pt-BR"),fmtTime(e.quandoMs),(tipoById[e.tipo]||{}).nome||"",e.valor,nomeSit(statusOf(e.valor,e.tipo)),e.comida||"",e.obs||""])});const csv="﻿"+rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(";")).join("\n");const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="glicemia-sarah.csv";document.body.appendChild(a);a.click();a.remove()};
renderChips();setTipo(guessTipo());renderSlots();renderHist();$("#quando").value=localInput(Date.now());
const salvo=store.get("glic_pin");if(salvo)entrar(salvo,true);
</script>
</body>
</html>
