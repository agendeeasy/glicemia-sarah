<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e9437a">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<title>Glicemia da Sarah</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap">
<style>
:root{
  --bg:#fdf5f8; --surface:#ffffff; --surface-2:#faf0f4; --fg:#33283f; --muted:#857a95; --line:#efe1e8;
  --accent:#e2407a; --accent-ink:#ffffff; --accent-soft:#fde3ed;
  --ok:#1b8f4e; --ok-soft:#dcf4e6; --warn:#d1490f; --warn-soft:#ffe7da; --low:#6440d4; --low-soft:#ebe5ff;
  --shadow:0 1px 2px rgba(80,30,60,.06),0 6px 18px rgba(80,30,60,.06);
  --display:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#18131d; --surface:#231b2a; --surface-2:#2b2233; --fg:#f4edf7; --muted:#ab9fbb; --line:#382d42;
  --accent:#ff6c9d; --accent-ink:#2a0c17; --accent-soft:#45202f;
  --ok:#5cd693; --ok-soft:#173726; --warn:#ff9a68; --warn-soft:#432418; --low:#b29aff; --low-soft:#2d244c;
  --shadow:none; color-scheme:dark}}
*{box-sizing:border-box}[hidden]{display:none!important}img{max-width:100%}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right)) calc(96px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.15}
h1{font-size:1.6rem}h2{font-size:1.15rem}h3{font-size:1rem}
.label{font-size:.72rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.btn{font-weight:800;border:0;border-radius:14px;padding:14px 18px;cursor:pointer;background:var(--accent);color:var(--accent-ink);font-size:1rem}
.btn.ghost{background:var(--accent-soft);color:var(--fg)}
.btn.small{padding:8px 12px;font-size:.85rem;border-radius:10px}
.btn[disabled]{opacity:.55}
.btn:focus-visible,.chip:focus-visible,.day-cell:focus-visible,.tab:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.hello{display:flex;flex-direction:column;gap:2px}
.date{color:var(--muted);font-weight:700;font-size:.9rem;text-transform:capitalize}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 12px;font-weight:800;font-size:.85rem;cursor:pointer;color:var(--muted)}

/* summary */
.summary{display:flex;align-items:center;gap:14px}
.ring{width:72px;height:72px;flex:none}
.summary b{font-family:var(--display);font-size:1.3rem}

/* slots */
.slots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.slot{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:2px;text-align:left;cursor:pointer;box-shadow:var(--shadow)}
.slot .v{font-family:var(--display);font-size:2rem;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.slot .meta{font-size:.78rem;color:var(--muted);font-weight:700}
.slot.empty .v{color:var(--accent);font-size:1rem;padding:9px 0 7px}
.slot.ok{border-color:var(--ok);background:var(--ok-soft)}
.slot.high{border-color:var(--warn);background:var(--warn-soft)}
.slot.low{border-color:var(--low);background:var(--low-soft)}

.pill{display:inline-block;font-size:.7rem;font-weight:800;padding:2px 8px;border-radius:999px;vertical-align:2px}
.pill.ok{background:var(--ok);color:var(--surface)}
.pill.high{background:var(--warn);color:var(--surface)}
.pill.low{background:var(--low);color:var(--surface)}

/* entries */
.list{display:flex;flex-direction:column;gap:8px}
.entry{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 12px}
.entry .num{font-family:var(--display);font-size:1.5rem;font-weight:600;min-width:58px;text-align:center;border-radius:12px;padding:4px 6px;font-variant-numeric:tabular-nums}
.num.ok{background:var(--ok-soft);color:var(--ok)}.num.high{background:var(--warn-soft);color:var(--warn)}.num.low{background:var(--low-soft);color:var(--low)}
.entry .t{font-weight:800}
.entry .food{font-size:.9rem;color:var(--muted);overflow-wrap:anywhere}
.entry img{width:52px;height:52px;object-fit:cover;border-radius:10px;cursor:pointer}
.entry .side{display:flex;flex-direction:column;align-items:end;gap:6px}
.linkbtn{font-size:.8rem;font-weight:700;color:var(--muted);background:none;border:0;cursor:pointer;padding:2px}
.confirm{grid-column:1/-1;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-weight:700;font-size:.9rem}
.empty-state{text-align:center;padding:18px 12px;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:16px}
.empty-state strong{display:block;color:var(--fg);font-family:var(--display);font-size:1.05rem;margin-bottom:2px}

/* calendar */
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cal-head h2{text-transform:capitalize}
.cal-nav{display:flex;gap:6px}
.cal-nav button{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:800;font-size:1.1rem}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .wd{text-align:center;font-size:.72rem;font-weight:800;color:var(--muted);padding-bottom:2px}
.day-cell{aspect-ratio:1;max-width:100%;border:1.5px solid transparent;background:var(--surface-2);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;font-weight:800;font-variant-numeric:tabular-nums;padding:0}
.day-cell .n{font-size:.95rem}
.day-cell .dots{display:flex;gap:2px;height:6px}
.day-cell .dots i{width:6px;height:6px;border-radius:50%;display:block}
.dots i.ok{background:var(--ok)}.dots i.high{background:var(--warn)}.dots i.low{background:var(--low)}
.day-cell.out{visibility:hidden}
.day-cell.today{border-color:var(--accent)}
.day-cell.sel{background:var(--accent);color:var(--accent-ink)}
.day-cell.future{opacity:.4;cursor:default}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;font-weight:700;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:50%;display:inline-block}

/* form sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(20,10,20,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px max(16px,env(safe-area-inset-right)) calc(18px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:14px}
.sheet .grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:0 auto}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.field .lbl{font-weight:800;font-size:.9rem}
input,textarea{font:inherit;color:var(--fg);background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:12px;width:100%}
textarea{min-height:64px;resize:vertical}
.big{font-family:var(--display);font-size:2.2rem;font-weight:600;text-align:center;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-weight:700;font-size:.85rem;border:1.5px solid var(--line);background:var(--bg);border-radius:999px;padding:8px 13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.photo-pick{display:flex;align-items:center;gap:12px}
.photo-pick label.btn{display:inline-flex;align-items:center;gap:8px}
.photo-pick img{width:72px;height:72px;object-fit:cover;border-radius:14px;border:1px solid var(--line)}
.verdict{border-radius:14px;padding:10px 12px;font-weight:700;font-size:.92rem}
.verdict.ok{background:var(--ok-soft);color:var(--ok)}.verdict.high{background:var(--warn-soft);color:var(--warn)}.verdict.low{background:var(--low-soft);color:var(--low)}

/* report */
.seg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;background:var(--surface-2);padding:4px;border-radius:14px}
.seg button{border:0;background:none;border-radius:10px;padding:9px 4px;font-weight:800;font-size:.85rem;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{background:var(--surface-2);border-radius:14px;padding:12px}
.stat b{display:block;font-family:var(--display);font-size:1.6rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.8rem;font-weight:700;color:var(--muted)}
.goals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;text-align:center}
.goals div{background:var(--surface-2);border-radius:14px;padding:10px 4px}
.goals b{display:block;font-family:var(--display);font-size:1.2rem}
.goals span{font-size:.74rem;font-weight:700;color:var(--muted)}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px max(8px,env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left))}
.tabs-in{display:grid;grid-template-columns:1fr 1fr 72px 1fr 1fr;align-items:center;width:100%;max-width:560px}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;cursor:pointer;color:var(--muted);font-size:.72rem;font-weight:800}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--accent)}
.fab{width:58px;height:58px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;margin:-26px auto 0;box-shadow:0 6px 16px rgba(226,64,122,.35);cursor:pointer}
.fab svg{width:28px;height:28px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:800;z-index:60;max-width:90vw;text-align:center}
.viewer{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:70;padding:24px}
.viewer img{max-height:90vh;border-radius:16px}
.status{font-size:.85rem;color:var(--muted);text-align:center}
.pin-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.pin-card{width:100%;max-width:380px;text-align:center}
.pin-logo{width:64px;height:64px;margin:0 auto}
@media (prefers-reduced-motion:no-preference){.btn,.chip,.slot,.day-cell,.fab{transition:transform .12s,background .15s}.btn:active,.chip:active,.slot:active,.day-cell:active,.fab:active{transform:scale(.96)}.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}}
</style>
</head>
<body>

<div class="pin-wrap" id="pinScreen">
  <div class="card pin-card">
    <svg class="pin-logo" viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" rx="24" fill="#e2407a"/><path d="M50 18c6 14 20 28 20 44a20 20 0 0 1-40 0c0-16 14-30 20-44z" fill="#fff"/></svg>
    <h1>Glicemia da Sarah</h1>
    <div class="field"><label for="pin">Digite o PIN</label>
      <input id="pin" class="big" type="password" inputmode="numeric" autocomplete="off" placeholder="••••••"></div>
    <button class="btn" id="entrarBtn" type="button">Entrar</button>
    <div class="status" id="pinStatus"></div>
  </div>
</div>

<div id="app" hidden>
  <!-- HOJE -->
  <main class="wrap" id="tab-hoje">
    <header class="top">
      <div class="hello"><h1>Oi, Sarah</h1><div class="date" id="today"></div></div>
      <button class="iconbtn" id="sairBtn" type="button">Sair</button>
    </header>
    <section class="card summary" id="summary"></section>
    <section style="display:flex;flex-direction:column;gap:10px">
      <div class="label">Medições de hoje</div>
      <div class="slots" id="slots"></div>
    </section>
    <section style="display:flex;flex-direction:column;gap:10px">
      <div class="label">Registros de hoje</div>
      <div class="list" id="todayList"></div>
    </section>
    <section style="display:flex;flex-direction:column;gap:10px">
      <div class="label">Metas</div>
      <div class="goals">
        <div><b>até 95</b><span>Jejum</span></div>
        <div><b>até 140</b><span>1h após comer</span></div>
        <div><b>abaixo de 70</b><span>comer algo</span></div>
      </div>
    </section>
  </main>

  <!-- CALENDÁRIO -->
  <main class="wrap" id="tab-cal" hidden>
    <section class="card">
      <div class="cal-head">
        <h2 id="calTitle"></h2>
        <div class="cal-nav"><button type="button" id="prevM" aria-label="Mês anterior">‹</button><button type="button" id="nextM" aria-label="Próximo mês">›</button></div>
      </div>
      <div class="cal" id="cal"></div>
      <div class="legend"><span><i style="background:var(--ok)"></i>na meta</span><span><i style="background:var(--warn)"></i>acima</span><span><i style="background:var(--low)"></i>baixa</span></div>
    </section>
    <section style="display:flex;flex-direction:column;gap:10px">
      <h2 id="dayTitle" style="text-transform:capitalize"></h2>
      <div class="slots" id="daySlots"></div>
      <div class="list" id="dayList"></div>
    </section>
  </main>

  <!-- RELATÓRIO -->
  <main class="wrap" id="tab-rel" hidden>
    <header class="top"><h1>Relatório</h1></header>
    <div class="seg" id="periodSeg" role="group" aria-label="Período">
      <button type="button" data-d="7" aria-pressed="true">7 dias</button>
      <button type="button" data-d="14" aria-pressed="false">14 dias</button>
      <button type="button" data-d="30" aria-pressed="false">30 dias</button>
      <button type="button" data-d="mes" aria-pressed="false">Este mês</button>
    </div>
    <section class="stats" id="stats"></section>
    <section class="card">
      <h2>PDF para o médico</h2>
      <p class="muted" style="margin:0">Tabela com as medições de cada dia, cores de meta, médias e o que ela comeu.</p>
      <button class="btn" id="pdfBtn" type="button">Baixar PDF</button>
    </section>
  </main>

  <nav class="tabs" aria-label="Navegação">
    <div class="tabs-in">
      <button class="tab" data-tab="hoje" aria-current="page" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Hoje</button>
      <button class="tab" data-tab="cal" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Calendário</button>
      <button class="fab" id="fab" type="button" aria-label="Nova medição"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
      <button class="tab" data-tab="rel" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5M10 13h6M10 17h6"/></svg>Relatório</button>
      <button class="tab" id="refreshBtn" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg>Atualizar</button>
    </div>
  </nav>
</div>

<!-- SHEET: nova medição -->
<div class="sheet-bg" id="sheet" hidden>
  <div class="sheet" role="dialog" aria-labelledby="sheetT">
    <div class="grab"></div>
    <div class="top"><h2 id="sheetT">Nova medição</h2><button class="iconbtn" id="fecharBtn" type="button">Fechar</button></div>
    <div class="field"><span class="lbl">Qual medição?</span><div class="chips" id="tipoChips"></div></div>
    <div class="field">
      <span class="lbl">Foto do aparelho</span>
      <div class="photo-pick">
        <label class="btn ghost small" for="foto">Tirar foto</label>
        <input type="file" id="foto" accept="image/*" capture="environment" hidden>
        <img id="fotoPrev" alt="Foto da medição" hidden>
      </div>
    </div>
    <div class="field"><label for="valor">Valor (mg/dL)</label><input id="valor" class="big" type="number" inputmode="numeric" min="20" max="600" placeholder="000"></div>
    <div id="verdict" class="verdict" hidden></div>
    <div class="field" id="comidaField"><label for="comida">O que ela comeu?</label><textarea id="comida" placeholder="Ex.: 2 bisnaguinhas com requeijão e queijo minas"></textarea></div>
    <div class="field"><label for="quando">Data e hora</label><input id="quando" type="datetime-local"></div>
    <div class="field"><label for="obs">Observação (opcional)</label><input id="obs" placeholder="Ex.: estava com dor, dormiu mal"></div>
    <button class="btn" id="salvarBtn" type="button">Salvar medição</button>
    <div class="status" id="status"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script>
const SB_URL="https://zdzftedtyziogirmjrjk.supabase.co",SB_KEY="sb_publishable_NhPfs8moxdI8m4ivZ8TKrw_bfNva6d_";
const TIPOS=[{id:"jejum",nome:"Jejum",curto:"Jejum",hora:"5h",meta:95,comida:false},{id:"cafe",nome:"Após café",curto:"Café",hora:"6h15",meta:140,comida:true},{id:"almoco",nome:"Após almoço",curto:"Almoço",hora:"12h",meta:140,comida:true},{id:"jantar",nome:"Após jantar",curto:"Jantar",hora:"20h30",meta:140,comida:true},{id:"outra",nome:"Outra",curto:"Outra",hora:"",meta:140,comida:true}];
const T=Object.fromEntries(TIPOS.map(t=>[t.id,t]));
const $=s=>document.querySelector(s);
let PIN="",entries=[],tipo="jejum",fotoFull=null,fotoMini=null,pendingDelete=null,calY,calM,selDay,period="7";

async function rpc(fn,body){const r=await fetch(SB_URL+"/rest/v1/rpc/glicemia_"+fn,{method:"POST",headers:{apikey:SB_KEY,"Content-Type":"application/json"},body:JSON.stringify(body)});const t=await r.text();let j=null;try{j=JSON.parse(t)}catch(e){}if(!r.ok){const e=new Error((j&&j.message)||"erro");e.code=(j&&j.message)||"erro";throw e}return j}
const api={
  entrar:p=>rpc("entrar",{p_pin:p}),
  listar:p=>rpc("listar",{p_pin:p}),
  foto:(p,id)=>rpc("foto",{p_pin:p,p_id:id}),
  apagar:(p,id)=>rpc("apagar",{p_pin:p,p_id:id}),
  salvar:(p,m)=>rpc("salvar",{p_pin:p,p_tipo:m.tipo,p_valor:m.valor,p_comida:m.comida,p_obs:m.obs,p_quando_ms:m.quandoMs,p_foto:m.foto,p_mini:m.mini}).then(id=>{if(!id)throw new Error("sem_id");return id})
};
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};

function statusOf(v,t){if(v<70)return"low";return v<=((T[t]&&T[t].meta)||140)?"ok":"high"}
function nomeSit(s){return s==="ok"?"na meta":s==="high"?"acima":"baixa"}
function verdictText(v,t){const s=statusOf(v,t),m=(T[t]&&T[t].meta)||140;if(s==="low")return"Glicose baixa. Coma algo agora (1 balinha) e meça de novo em 15 minutos.";if(s==="ok")return"Dentro da meta (até "+m+"). Muito bem!";return"Acima da meta (até "+m+"). Anote o que comeu. Se repetir na semana, avise o médico."}
function dayKey(ms){const d=new Date(ms);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function keyToDate(k){const p=k.split("-").map(Number);return new Date(p[0],p[1]-1,p[2])}
function fmtTime(ms){return new Date(ms).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})}
function fmtDayLong(k){if(k===dayKey(Date.now()))return"Hoje";if(k===dayKey(Date.now()-864e5))return"Ontem";return keyToDate(k).toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long"})}
function localInput(ms){const d=new Date(ms);d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,16)}
function toast(msg){const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}
function guessTipo(){const h=new Date().getHours()+new Date().getMinutes()/60;if(h<5.75)return"jejum";if(h<9)return"cafe";if(h<16)return"almoco";return"jantar"}
function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
function byDay(){const g={};entries.forEach(e=>{const k=dayKey(e.quandoMs);(g[k]=g[k]||[]).push(e)});Object.values(g).forEach(a=>a.sort((x,y)=>x.quandoMs-y.quandoMs));return g}

/* ---------- render: slots + entries ---------- */
function renderSlotsInto(box,key){
  box.innerHTML="";const list=entries.filter(x=>dayKey(x.quandoMs)===key);
  TIPOS.slice(0,4).forEach(t=>{
    const e=list.filter(x=>x.tipo===t.id).sort((a,b)=>b.quandoMs-a.quandoMs)[0];
    const s=e?statusOf(e.valor,t.id):"";const b=el("button","slot "+(e?s:"empty"));b.type="button";
    b.append(el("div","label",t.nome+(t.hora?" · "+t.hora:"")),el("div","v",e?e.valor:"+ Registrar"),el("div","meta",e?("meta até "+t.meta+" · "+fmtTime(e.quandoMs)):("meta até "+t.meta)));
    b.onclick=()=>openSheet(t.id,key);box.appendChild(b);
  });
}
function renderEntriesInto(box,list,emptyMsg){
  box.innerHTML="";
  if(!list.length){const d=el("div","empty-state");d.append(el("strong",null,"Nada registrado"),document.createTextNode(emptyMsg));box.appendChild(d);return}
  list.slice().sort((a,b)=>a.quandoMs-b.quandoMs).forEach(e=>{
    const s=statusOf(e.valor,e.tipo),row=el("div","entry");
    const mid=el("div");const t=el("div","t",((T[e.tipo]||{}).nome||"Medição")+" · "+fmtTime(e.quandoMs)+" ");t.appendChild(el("span","pill "+s,nomeSit(s)));mid.appendChild(t);
    if(e.comida)mid.appendChild(el("div","food",e.comida));if(e.obs)mid.appendChild(el("div","food","Obs.: "+e.obs));
    const side=el("div","side");
    if(e.mini&&String(e.mini).indexOf("data:image/")===0){const im=el("img");im.src=e.mini;im.alt="Foto do aparelho";im.onclick=async()=>{openViewer(im.src);if(e.temFoto){try{const f=await api.foto(PIN,e.id);if(f){const v=$(".viewer img");if(v)v.src=f}}catch(x){}}};side.appendChild(im)}
    const del=el("button","linkbtn","Apagar");del.type="button";del.onclick=()=>{pendingDelete=e.id;renderAll()};side.appendChild(del);
    row.append(el("div","num "+s,e.valor),mid,side);
    if(pendingDelete===e.id){const c=el("div","confirm");c.append("Apagar esta medição?");const y=el("button","btn small","Apagar");y.type="button";y.onclick=async()=>{try{await api.apagar(PIN,e.id);entries=entries.filter(x=>x.id!==e.id);toast("Medição apagada")}catch(err){toast("Não foi possível apagar")}pendingDelete=null;renderAll()};const n=el("button","btn small ghost","Cancelar");n.type="button";n.onclick=()=>{pendingDelete=null;renderAll()};c.append(y,n);row.appendChild(c)}
    box.appendChild(row);
  });
}
function openViewer(src){const v=el("div","viewer");const im=el("img");im.src=src;im.alt="Foto ampliada";v.appendChild(im);v.onclick=()=>v.remove();document.body.appendChild(v)}

/* ---------- hoje ---------- */
function ring(pct){const r=30,c=2*Math.PI*r,off=c*(1-pct);return '<svg class="ring" viewBox="0 0 72 72" aria-hidden="true"><circle cx="36" cy="36" r="'+r+'" fill="none" stroke="var(--line)" stroke-width="8"/><circle cx="36" cy="36" r="'+r+'" fill="none" stroke="var(--ok)" stroke-width="8" stroke-linecap="round" stroke-dasharray="'+c.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'" transform="rotate(-90 36 36)"/><text x="36" y="41" text-anchor="middle" font-family="Fredoka,sans-serif" font-size="16" font-weight="600" fill="var(--fg)">'+Math.round(pct*100)+'%</text></svg>'}
function renderHoje(){
  const k=dayKey(Date.now()),hoje=entries.filter(x=>dayKey(x.quandoMs)===k);
  const feitos=TIPOS.slice(0,4).filter(t=>hoje.some(e=>e.tipo===t.id)).length;
  const ok=hoje.filter(e=>statusOf(e.valor,e.tipo)==="ok").length;
  const sum=$("#summary");
  const pct=hoje.length?ok/hoje.length:0;
  sum.innerHTML=ring(pct);
  const txt=el("div");const prox=TIPOS.slice(0,4).find(t=>!hoje.some(e=>e.tipo===t.id));
  txt.append(el("b",null,feitos+" de 4 medições"),el("div","muted",hoje.length?(ok+" de "+hoje.length+" dentro da meta hoje"):"Nenhuma medição ainda hoje"),el("div","muted",prox?("Próxima: "+prox.nome+" ("+prox.hora+")"):"Todas as medições de hoje feitas"));
  sum.appendChild(txt);
  renderSlotsInto($("#slots"),k);
  renderEntriesInto($("#todayList"),hoje,"Toque no + para registrar a primeira medição do dia.");
}

/* ---------- calendário ---------- */
function worst(list){if(list.some(e=>statusOf(e.valor,e.tipo)==="low"))return"low";if(list.some(e=>statusOf(e.valor,e.tipo)==="high"))return"high";return"ok"}
function renderCal(){
  const g=byDay(),first=new Date(calY,calM,1),days=new Date(calY,calM+1,0).getDate(),start=first.getDay(),hojeK=dayKey(Date.now());
  $("#calTitle").textContent=first.toLocaleDateString("pt-BR",{month:"long",year:"numeric"});
  const cal=$("#cal");cal.innerHTML="";
  ["D","S","T","Q","Q","S","S"].forEach(w=>cal.appendChild(el("div","wd",w)));
  for(let i=0;i<start;i++){const b=el("div","day-cell out");cal.appendChild(b)}
  for(let d=1;d<=days;d++){
    const k=calY+"-"+String(calM+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");
    const list=g[k]||[],future=keyToDate(k)>new Date();
    const b=el("button","day-cell"+(k===hojeK?" today":"")+(k===selDay?" sel":"")+(future?" future":""));b.type="button";
    b.appendChild(el("span","n",d));const dots=el("span","dots");
    list.slice(0,4).forEach(e=>dots.appendChild(el("i",statusOf(e.valor,e.tipo))));b.appendChild(dots);
    b.setAttribute("aria-label",d+(list.length?", "+list.length+" medições":", sem medições"));
    if(!future)b.onclick=()=>{selDay=k;renderCal();renderDay()};
    cal.appendChild(b);
  }
}
function renderDay(){
  if(!selDay)selDay=dayKey(Date.now());
  $("#dayTitle").textContent=fmtDayLong(selDay);
  renderSlotsInto($("#daySlots"),selDay);
  renderEntriesInto($("#dayList"),entries.filter(x=>dayKey(x.quandoMs)===selDay),"Nenhuma medição registrada neste dia.");
}

/* ---------- relatório ---------- */
function periodRange(){const end=new Date();end.setHours(23,59,59,999);let start=new Date();
  if(period==="mes"){start=new Date(end.getFullYear(),end.getMonth(),1)}else{start.setDate(start.getDate()-(Number(period)-1))}
  start.setHours(0,0,0,0);return[start,end]}
function periodEntries(){const[a,b]=periodRange();return entries.filter(e=>e.quandoMs>=a.getTime()&&e.quandoMs<=b.getTime())}
function avg(a){return a.length?Math.round(a.reduce((s,x)=>s+x,0)/a.length):null}
function calcStats(list){
  const jej=list.filter(e=>e.tipo==="jejum").map(e=>e.valor),pos=list.filter(e=>e.tipo!=="jejum").map(e=>e.valor);
  const ok=list.filter(e=>statusOf(e.valor,e.tipo)==="ok").length;
  return{n:list.length,pct:list.length?Math.round(ok/list.length*100):0,jej:avg(jej),pos:avg(pos),acima:list.filter(e=>statusOf(e.valor,e.tipo)==="high").length,baixa:list.filter(e=>statusOf(e.valor,e.tipo)==="low").length,dias:new Set(list.map(e=>dayKey(e.quandoMs))).size}
}
function renderRel(){
  const s=calcStats(periodEntries()),box=$("#stats");box.innerHTML="";
  [[s.pct+"%","dentro da meta"],[s.n,"medições em "+s.dias+" dias"],[s.jej??"—","média do jejum"],[s.pos??"—","média após refeições"],[s.acima,"acima da meta"],[s.baixa,"glicose baixa"]].forEach(([v,l])=>{const d=el("div","stat");d.append(el("b",null,v),el("span",null,l));box.appendChild(d)});
}
function gerarPDF(){
  if(!window.jspdf){toast("Não consegui carregar o gerador de PDF. Confira a internet.");return}
  const {jsPDF}=window.jspdf,doc=new jsPDF({unit:"mm",format:"a4"});
  const[a,b]=periodRange(),list=periodEntries(),s=calcStats(list),W=doc.internal.pageSize.getWidth();
  const pink=[226,64,122],green=[220,244,230],orange=[255,231,218],purple=[235,229,255];
  doc.setFillColor(...pink);doc.rect(0,0,W,30,"F");
  doc.setTextColor(255,255,255);doc.setFont("helvetica","bold");doc.setFontSize(18);doc.text("Diário de Glicemia - Sarah",14,14);
  doc.setFont("helvetica","normal");doc.setFontSize(10.5);
  doc.text("Diabetes gestacional  |  Período: "+a.toLocaleDateString("pt-BR")+" a "+b.toLocaleDateString("pt-BR")+"  |  Gerado em "+new Date().toLocaleDateString("pt-BR"),14,22);
  doc.setTextColor(51,40,63);
  const boxes=[[s.pct+"%","dentro da meta"],[String(s.n),"medições"],[s.jej!=null?s.jej+" mg/dL":"-","média jejum"],[s.pos!=null?s.pos+" mg/dL":"-","média pós-refeição"]];
  const bw=(W-28-9)/4;boxes.forEach((x,i)=>{const x0=14+i*(bw+3);doc.setFillColor(250,240,244);doc.roundedRect(x0,36,bw,20,3,3,"F");doc.setFont("helvetica","bold");doc.setFontSize(14);doc.text(x[0],x0+bw/2,46,{align:"center"});doc.setFont("helvetica","normal");doc.setFontSize(8.5);doc.setTextColor(120,110,135);doc.text(x[1],x0+bw/2,52,{align:"center"});doc.setTextColor(51,40,63)});
  doc.setFontSize(9);doc.setTextColor(120,110,135);
  doc.text("Metas: jejum até 95 mg/dL  |  1 hora após refeição até 140 mg/dL  |  abaixo de 70 = glicose baixa",14,63);
  doc.setTextColor(51,40,63);
  const g={};list.forEach(e=>{const k=dayKey(e.quandoMs);(g[k]=g[k]||[]).push(e)});
  const keys=Object.keys(g).sort();
  const body=keys.map(k=>{const d=keyToDate(k);const row=[d.toLocaleDateString("pt-BR",{weekday:"short",day:"2-digit",month:"2-digit"})];
    TIPOS.slice(0,4).forEach(t=>{const es=g[k].filter(e=>e.tipo===t.id);row.push(es.length?es.map(e=>e.valor+" ("+fmtTime(e.quandoMs)+")").join("\n"):"-")});return row});
  doc.autoTable({startY:68,head:[["Dia","Jejum","Após café","Após almoço","Após jantar"]],body:body.length?body:[["Sem medições no período","","","",""]],
    theme:"grid",styles:{font:"helvetica",fontSize:10,cellPadding:3,halign:"center",valign:"middle",lineColor:[239,225,232],textColor:[51,40,63]},
    headStyles:{fillColor:pink,textColor:255,fontStyle:"bold"},columnStyles:{0:{halign:"left",fontStyle:"bold",cellWidth:34}},
    didParseCell:h=>{if(h.section!=="body"||h.column.index===0||!keys.length)return;const k=keys[h.row.index],t=TIPOS[h.column.index-1].id,es=g[k].filter(e=>e.tipo===t);if(!es.length)return;const w=worst(es);h.cell.styles.fillColor=w==="ok"?green:w==="high"?orange:purple;h.cell.styles.fontStyle="bold"}});
  let y=doc.lastAutoTable.finalY+6;
  doc.setFontSize(8.5);doc.setTextColor(120,110,135);
  [["na meta",green],["acima da meta",orange],["glicose baixa",purple]].forEach(([l,c],i)=>{doc.setFillColor(...c);doc.rect(14+i*45,y-3,4,4,"F");doc.text(l,20+i*45,y)});
  doc.setTextColor(51,40,63);
  const ref=list.filter(e=>e.comida||e.obs).sort((x,z)=>x.quandoMs-z.quandoMs).map(e=>[new Date(e.quandoMs).toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"})+" "+fmtTime(e.quandoMs),(T[e.tipo]||{}).nome||"",String(e.valor),[e.comida,e.obs?("Obs.: "+e.obs):""].filter(Boolean).join("\n")]);
  if(ref.length){
    y+=8;if(y>260){doc.addPage();y=20}
    doc.setFont("helvetica","bold");doc.setFontSize(13);doc.text("O que ela comeu",14,y);
    doc.autoTable({startY:y+3,head:[["Quando","Medição","mg/dL","Refeição / observação"]],body:ref,theme:"striped",
      styles:{font:"helvetica",fontSize:9.5,cellPadding:2.5,textColor:[51,40,63]},headStyles:{fillColor:[51,40,63],textColor:255},
      alternateRowStyles:{fillColor:[250,240,244]},columnStyles:{0:{cellWidth:26},1:{cellWidth:28},2:{cellWidth:16,halign:"center",fontStyle:"bold"}},
      didParseCell:h=>{if(h.section==="body"&&h.column.index===2){const e=list.filter(x=>x.comida||x.obs).sort((x,z)=>x.quandoMs-z.quandoMs)[h.row.index];const w=statusOf(e.valor,e.tipo);h.cell.textColor=w==="ok"?[27,143,78]:w==="high"?[209,73,15]:[100,64,212]}}});
  }
  const pages=doc.internal.getNumberOfPages();
  for(let i=1;i<=pages;i++){doc.setPage(i);doc.setFontSize(8);doc.setTextColor(150,140,160);doc.text("Registro feito pela paciente em casa com glicosímetro. Página "+i+" de "+pages,14,290)}
  doc.save("glicemia-sarah-"+dayKey(Date.now())+".pdf");
  toast("PDF baixado");
}

/* ---------- sheet ---------- */
function renderChips(){const box=$("#tipoChips");box.innerHTML="";TIPOS.forEach(t=>{const b=el("button","chip",t.nome);b.type="button";b.setAttribute("aria-pressed",String(t.id===tipo));b.onclick=()=>{tipo=t.id;renderChips();updateVerdict()};box.appendChild(b)});$("#comidaField").hidden=!T[tipo].comida}
function updateVerdict(){const v=Number($("#valor").value),box=$("#verdict");if(!v){box.hidden=true;return}const s=statusOf(v,tipo);box.className="verdict "+s;box.textContent=verdictText(v,tipo);box.hidden=false}
function openSheet(t,key){
  tipo=t||guessTipo();renderChips();
  let ms=Date.now();if(key&&key!==dayKey(Date.now())){const d=keyToDate(key);const now=new Date();d.setHours(now.getHours(),now.getMinutes());ms=d.getTime()}
  $("#quando").value=localInput(ms);$("#status").textContent="";updateVerdict();
  $("#sheet").hidden=false;setTimeout(()=>$("#valor").focus({preventScroll:true}),250);
}
function closeSheet(){$("#sheet").hidden=true}
async function toDataUrl(file,max,q){const url=URL.createObjectURL(file);const img=await new Promise((r,j)=>{const i=new Image();i.onload=()=>r(i);i.onerror=j;i.src=url});const sc=Math.min(1,max/Math.max(img.width,img.height));const cv=document.createElement("canvas");cv.width=Math.round(img.width*sc);cv.height=Math.round(img.height*sc);cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);URL.revokeObjectURL(url);return cv.toDataURL("image/jpeg",q)}
$("#foto").addEventListener("change",async ev=>{const f=ev.target.files&&ev.target.files[0];if(!f){fotoFull=fotoMini=null;$("#fotoPrev").hidden=true;return}try{fotoFull=await toDataUrl(f,900,.7);fotoMini=await toDataUrl(f,220,.6);const p=$("#fotoPrev");p.src=fotoMini;p.hidden=false}catch(e){toast("Não consegui abrir a foto")}});
$("#valor").addEventListener("input",updateVerdict);
$("#salvarBtn").onclick=async()=>{
  const v=Number($("#valor").value);if(!(v>=20&&v<=600)){$("#status").textContent="Digite o valor que apareceu no aparelho (entre 20 e 600).";$("#valor").focus();return}
  const btn=$("#salvarBtn");btn.disabled=true;btn.textContent="Salvando...";$("#status").textContent="";
  const ms=$("#quando").value?new Date($("#quando").value).getTime():Date.now();
  const m={tipo,valor:v,comida:T[tipo].comida?$("#comida").value.trim():"",obs:$("#obs").value.trim(),quandoMs:ms,foto:fotoFull,mini:fotoMini};
  try{const id=await api.salvar(PIN,m);entries.unshift({id,tipo,valor:v,comida:m.comida,obs:m.obs,mini:fotoMini,temFoto:!!fotoFull,quandoMs:ms});
    toast(statusOf(v,tipo)==="ok"?"Salvo! Dentro da meta.":statusOf(v,tipo)==="low"?"Salvo. Glicose baixa: coma algo agora.":"Salvo.");
    $("#valor").value="";$("#comida").value="";$("#obs").value="";$("#foto").value="";fotoFull=fotoMini=null;$("#fotoPrev").hidden=true;
    closeSheet();renderAll();
  }catch(err){$("#status").textContent="Não foi possível salvar. Confira a internet e tente de novo."}
  btn.disabled=false;btn.textContent="Salvar medição";
};
$("#fecharBtn").onclick=closeSheet;
$("#sheet").addEventListener("click",e=>{if(e.target.id==="sheet")closeSheet()});
$("#fab").onclick=()=>openSheet(null,$("#tab-cal").hidden?null:selDay);

/* ---------- tabs ---------- */
function showTab(name){["hoje","cal","rel"].forEach(n=>{$("#tab-"+n).hidden=n!==name});document.querySelectorAll(".tab[data-tab]").forEach(b=>{if(b.dataset.tab===name)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")});window.scrollTo(0,0);renderAll()}
document.querySelectorAll(".tab[data-tab]").forEach(b=>b.onclick=()=>showTab(b.dataset.tab));
$("#prevM").onclick=()=>{calM--;if(calM<0){calM=11;calY--}renderCal()};
$("#nextM").onclick=()=>{calM++;if(calM>11){calM=0;calY++}renderCal()};
document.querySelectorAll("#periodSeg button").forEach(b=>b.onclick=()=>{period=b.dataset.d;document.querySelectorAll("#periodSeg button").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));renderRel()});
$("#pdfBtn").onclick=gerarPDF;
$("#refreshBtn").onclick=async()=>{await carregar();toast("Atualizado")};

function renderAll(){renderHoje();renderCal();renderDay();renderRel()}

/* ---------- entrar ---------- */
async function entrar(pin,silencioso){
  $("#pinStatus").textContent=silencioso?"":"Entrando...";
  try{const ok=await api.entrar(pin);if(ok!==true)throw new Error("pin");PIN=pin;store.set("glic_pin",pin);$("#pinScreen").hidden=true;$("#app").hidden=false;await carregar()}
  catch(e){store.del("glic_pin");$("#pinScreen").hidden=false;$("#app").hidden=true;$("#pinStatus").textContent=silencioso?"":"PIN incorreto. Se errar muitas vezes, espere 10 minutos."}
}
async function carregar(){try{entries=(await api.listar(PIN))||[];renderAll()}catch(e){toast("Não foi possível carregar. Confira a internet.")}}
$("#entrarBtn").onclick=()=>entrar($("#pin").value.trim());
$("#pin").addEventListener("keydown",e=>{if(e.key==="Enter")entrar($("#pin").value.trim())});
$("#sairBtn").onclick=()=>{store.del("glic_pin");PIN="";entries=[];$("#app").hidden=true;$("#pinScreen").hidden=false;$("#pin").value=""};

$("#today").textContent=new Date().toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long"});
const now=new Date();calY=now.getFullYear();calM=now.getMonth();selDay=dayKey(Date.now());
renderAll();
const salvo=store.get("glic_pin");if(salvo)entrar(salvo,true);
</script>
